# Forge production stack on one VPS.
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.prod up -d --build
# Only Caddy is reachable from the internet (80/443, automatic HTTPS). Postgres and Redis stay on the
# internal network. indexer and relayer need deployed contracts: start them with --profile launch.
name: forge

x-node: &node
  build: &build
    context: ..
    dockerfile: Dockerfile
  env_file: .env.prod
  environment:
    NODE_ENV: production
    DATABASE_URL: postgres://forge:${POSTGRES_PASSWORD}@postgres:5432/forge
    REDIS_URL: redis://redis:6379
  restart: unless-stopped
  depends_on:
    migrate: { condition: service_completed_successfully }
    redis: { condition: service_healthy }
  logging: &logging
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  postgres:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: forge
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forge -d forge"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    logging: *logging

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    logging: *logging

  migrate:
    build: { <<: *build, args: { APP: api } }
    working_dir: /repo/packages/db
    command: ["node", "src/cli-migrate.ts"]
    environment:
      DATABASE_URL: postgres://forge:${POSTGRES_PASSWORD}@postgres:5432/forge
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    <<: *node
    build: { <<: *build, args: { APP: api } }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 15s
      timeout: 3s
      retries: 6

  worker:
    <<: *node
    build: { <<: *build, args: { APP: worker } }

  indexer:
    <<: *node
    build: { <<: *build, args: { APP: indexer } }
    profiles: ["launch"]

  relayer:
    <<: *node
    build: { <<: *build, args: { APP: relayer } }
    profiles: ["launch"]

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: https://api.${DOMAIN}
        NEXT_PUBLIC_RPC_URL: ${PUBLIC_RPC_URL}
        NEXT_PUBLIC_CHAIN_ID: ${CHAIN_ID}
        NEXT_PUBLIC_CHAIN_NAME: ${CHAIN_NAME}
        NEXT_PUBLIC_EXPLORER_URL: ${EXPLORER_URL}
        NEXT_PUBLIC_PRELAUNCH: ${PRELAUNCH:-0}
    restart: unless-stopped
    logging: *logging

  caddy:
    image: caddy:2.8-alpine
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on: [web, api]
    restart: unless-stopped
    logging: *logging

volumes:
  pgdata:
  redisdata:
  caddydata:
  caddyconfig:
