name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - run: npm ci
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.9.0
      - run: forge build --sizes
      - run: FOUNDRY_PROFILE=ci forge test -vv
      - name: Slither
        uses: crytic/slither-action@v0.4.0
        with:
          target: contracts
          fail-on: high
          slither-args: --filter-paths "node_modules|test"

  services:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_USER: sealdesk
          POSTGRES_PASSWORD: sealdesk
          POSTGRES_DB: sealdesk
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sealdesk" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://sealdesk:sealdesk@localhost:5432/sealdesk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test   # the e2e suite skips itself here: no anvil in this job
      - name: Migrations apply on real Postgres + TimescaleDB
        run: npm run db:migrate
      - name: Schema is in sync with migrations
        run: |
          npm run db:generate
          git diff --exit-code packages/db/migrations

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.9.0
      - run: npm ci
      - run: (cd contracts && npm ci && forge build)
      - name: SDK bundle is browser-safe
        run: npm run build -w @sealdesk/sdk
      - name: MCP single-file bundle
        run: npm run build -w @sealdesk/mcp
      - name: End to end on anvil (contracts + API + indexer + relayer + SDK + MCP)
        run: npm test -w @sealdesk/e2e

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test -w @sealdesk/web
      - name: Production build (typecheck + compile every route)
        run: npm run build -w @sealdesk/web
        env:
          NEXT_PUBLIC_API_URL: https://api.example.invalid
          NEXT_PUBLIC_RPC_URL: https://rpc.example.invalid
          NEXT_PUBLIC_CHAIN_ID: "4663"

  docker:
    runs-on: ubuntu-latest
    needs: [services]
    strategy:
      matrix:
        app: [api, indexer, relayer, worker]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: APP=${{ matrix.app }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
